<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/src/assets/icon.svg" />
		<link rel="stylesheet" href="/src/assets/reset.css" />
		<link rel="stylesheet" href="/src/assets/style.css" />
		<link rel="stylesheet" href="/src/assets/custom.css" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<script>
			(() => {
				try {
					const stored = localStorage.getItem("redraft-theme");
					const dark = stored
						? stored === "dark"
						: matchMedia("(prefers-color-scheme: dark)").matches;
					document.documentElement.classList.toggle("dark", dark);
				} catch {
					// Private browsing mode etc, just use the light theme
				}
			})();
		</script>
		<title>Redraft</title>
	</head>
	<body>
		<div id="app" style="display: contents">
			<!-- Route components will be rendered here -->
		</div>
	</body>
</html>
