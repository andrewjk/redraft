packages:
  - "packages/*"
  - "packages/adapters/*"
allowBuilds:
  esbuild: true
  spawn-sync: false
  workerd: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest: 5.0.3
  vite-plus: 1.1.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
minimumReleaseAgeExclude:
  - "@torpor/build"
  - "@torpor/ui"
  - "@torpor/unplugin"
  - "@torpor/view"
  - "@torpor/adapter-cloudflare"
  - "@torpor/adapter-node"
